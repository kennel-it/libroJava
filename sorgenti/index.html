<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="it">
    <head>
        <title>Programming java</title>
        <link type="text/css" rel="stylesheet" href="style.css"/>
        <meta name="description" content="degli appunti per imparare a programmare con java e javafx" />
        <meta charset="UTF-8">
        <style type="text/css">
        	#copertina { width:100% } 
        	ol a { text-decoration:none }
        	p { text-indent: 0px }
        	h1 { margin-bottom:0px ; text-align: center }
        	#pager span { 
        		display: inline-block; text-align: center ; width: 50% ;
        		background-color: #d9f1c6 ; padding:1em ;  border:0.25em solid white
        	}
        	#cerca { display: inline-block; text-align:center ; padding: 0.5em 1em; background-color: #ddd}
            #cerca p { font-size:75% ; margin: 0 }
            #eseguiCerca { border:1px solid orange; background:yellow ; 
        		font-size:75%; border-radius:4px ; padding:0em 1em;
        	}
        	#risultatoRicerca {height: 1em}
        	footer { margin:1em; margin-top:4em }
        	
        	nav#toc { margin:0em 2em ; background-color: white }
            nav#toc > * { text-align:left ; background-color: white; color:black }
            
            #strumenti {
                display: flex;
                flex-flow: row;
                justify-content: center;
                align-items: center;
            }
            
            #IDE { margin-left:1em ; cursor: pointer;}
        </style>
        <script type="text/javascript">
        //<![CDATA[
        	function grafo(){
        		document.getElementById("pg").style.fontWeight='bold';
        		document.getElementById("pe").style.fontWeight='normal';
        		document.getElementById("grafo").style.display='block';
        		document.getElementById("toc").style.display='none';
        	}
        	function elenco(){
        		document.getElementById("pg").style.fontWeight='normal';
        		document.getElementById("pe").style.fontWeight='bold';
        		document.getElementById("grafo").style.display='none';
        		document.getElementById("toc").style.display='block';
        	}
		
		function logoIDE(){
			document.getElementById("IDE").src= "immagini/ide_"+localStorage.getItem("ide")+".png";
		}
		
		function cambiaIDE(){
			var attuale = localStorage.getItem("ide");
			if(attuale==null){
				localStorage.setItem("ide", "netbeans");
			}else if(attuale=="netbeans"){
                localStorage.setItem("ide", "eclipse");
			}else{
				localStorage.removeItem("ide");
			}
			logoIDE();
		}
		// Temporanemente forziamo Eclipse come unica interfaccia
		localStorage.setItem("ide", "eclipse");
        //]]>
        </script>       
    </head>
    <body onload="logoIDE()">        
        <img id="copertina" src="immagini/titolo.svg" alt="programming java"/>        
        
        <div id="pagina"> 
        	<div id="pager">
        		<span onclick="grafo()" id="pg" style="font-weight: bold">grafo</span><span onclick="elenco()" id="pe">elenco</span>
        	</div> 
        	<div id="grafo" style="text-align: center">
        		<div id="strumenti">
	        		<!-- search -->
	        		<!--  <img id="IDE" src="immagini/netbeans.png" alt="IDE" onclick="cambiaIDE()"/>  -->
        		</div>		
        		<!-- placeholder: index graph -->
        	</div> 
	        <nav id="toc" style="display:none;">
	            <!-- placeholder: index html -->
	        </nav>    
        </div>
        <footer style="font-size:13px">
        <a rel="license" href="http://creativecommons.org/licenses/by-nc-sa/4.0/"><img alt="Licenza Creative Commons" style="border-width:0;float:left; margin-right:1em" src="immagini/cc-by-nc-sa.png" /></a>Quest'opera è distribuita con Licenza <a rel="license" href="http://creativecommons.org/licenses/by-nc-sa/4.0/">Creative Commons Attribuzione - Non commerciale - Condividi allo stesso modo 4.0 Internazionale</a>.
        </footer>
    </body>
</html>
